name: Upmix 5.1 V0.1b
on:
  workflow_dispatch:
  push:
    branches: [experimental/upmix51-v01b]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          submodules: recursive
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android build dependencies
        run: sdkmanager 'platforms;android-34' 'build-tools;30.0.3' 'ndk;21.0.6113669'
      - name: Test upmix and build signed debug APKs
        run: bash gradlew --no-daemon :exoplayer-library-core:testDebugUnitTest --tests '*Upmix*Test' :smarttubetv:assembleStbetaDebug
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SmartTube-Upmix51-v0.1b
          path: smarttubetv/build/outputs/apk/stbeta/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: Upmix51-test-report
          path: exoplayer-amzn-2.10.6/library/core/build/reports/tests/testDebugUnitTest/
